name: Rebuild V2 Sandbox Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rebuild-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild v2 sandbox snapshot
        run: |
          curl -sf -X POST \
            -H "server-token: ${{ secrets.CRON_SECRET_TOKEN }}" \
            https://v1.mindstudio-api.com/v1/admin/app-functions/rebuild-v2-sandbox-snapshot
